services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: form-web:dev
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://host.docker.internal:5080
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
